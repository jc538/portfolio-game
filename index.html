   EL OJO — simulador POV de cobertura de eventos. Archivo unico.
   Editar unicamente el bloque CFG.

const CFG = {
  NAME : 'LEONARDO PISANI',
  ROLE : 'PHOTO & VIDEO MAKER',
  BRAND: 'RAWR.AV',
  PORTFOLIO: 'https://leopisani.myportfolio.com',
  WHATSAPP : 'https://wa.me/5491151183272?text=' +
             encodeURIComponent('Hola Leo! Jugué a EL OJO y quiero consultarte por una cobertura.'),
  ACCENT: '#ffcc00', ACC_D:'#a88600'
};

const INK='#08080b', WHITE='#f2f0ec', GREY='#7d7a88', BAD='#ff3f5f',
      GOOD='#4dff9b', CYAN='#4de2ff';

/* ---------- canvas ---------- */
const W=180, H=320, VF=226, BRF=268;      // visor / franja de brief / cuerpo
const cv=document.getElementById('c'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');
function fit(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth, vh=vv?vv.height:window.innerHeight;
  const s=Math.min(vw/W,vh/H);
  stage.style.width=Math.round(W*s)+'px'; stage.style.height=Math.round(H*s)+'px';
}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));}
function ring(cx,cy,r,c){
  if(r<1)return; ctx.fillStyle=c;
  let x=Math.round(r),y=0,err=0;
  while(x>=y){const p=[[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]];
    for(let i=0;i<8;i++) ctx.fillRect((cx+p[i][0])|0,(cy+p[i][1])|0,1,1);
    y++; if(err<=0) err+=2*y+1; if(err>0){x--;err-=2*x+1;}}
}
function disc(cx,cy,r,c){
  ctx.fillStyle=c;
  for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));
    ctx.fillRect((cx-w)|0,(cy+y)|0,2*w+1,1);}
}
function dith(x,y,w,h,c,d){
  ctx.fillStyle=c; d=d||2;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++) if(((i+j*d)%d)===0) ctx.fillRect((x+i)|0,(y+j)|0,1,1);
}

/* ---------- fuente 3x5 ---------- */
const FT={
'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110',
'E':'111100110100111','F':'111100110100100','G':'011100101101011','H':'101101111101101',
'I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111',
'M':'101111111101101','N':'101111111111101','O':'010101101101010','P':'110101110100100',
'Q':'010101101011001','R':'110101110101101','S':'011100010001110','T':'111010010010010',
'U':'101101101101011','V':'101101101101010','W':'101101111111101','X':'101101010101101',
'Y':'101101010010010','Z':'111001010100111','Ñ':'111101111111101',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100110101010','7':'111001010010010',
'8':'010101010101010','9':'010101011001110',
' ':'000000000000000','.':'000000000000010',',':'000000000010100','!':'010010010000010',
'?':'110001010000010',':':'000010000010000','-':'000000111000000','/':'001001010100100',
'+':'000010111010000','%':'101001010100101',"'":'010010000000000','(':'001010010010001',
')':'100010010010100','=':'000111000111000','*':'000101010101000','#':'101111101111101',
'>':'100010001010100','<':'001010100010001','@':'010101111100011'};
function tw(s,sc){return s.length*4*sc-sc;}
function txt(s,x,y,c,sc,al){
  sc=sc||1; s=String(s).toUpperCase();
  if(al==='c') x-=Math.floor(tw(s,sc)/2); else if(al==='r') x-=tw(s,sc);
  ctx.fillStyle=c;
  for(let i=0;i<s.length;i++){const g=FT[s[i]];
    if(g) for(let r=0;r<5;r++)for(let k=0;k<3;k++)
      if(g[r*3+k]==='1') ctx.fillRect((x+k*sc)|0,(y+r*sc)|0,sc,sc);
    x+=4*sc;}
}
function star(x,y,s,c){
  const px=[[1,0],[0,1],[1,1],[2,1],[1,2],[0,3],[2,3]];
  ctx.fillStyle=c; for(const p of px) ctx.fillRect((x+p[0]*s)|0,(y+p[1]*s)|0,s,s);
}

/* =========================================================================
   PERSONA PARAMETRICA
   Cuerpo de 8 unidades de ancho x 17 de alto. Los pies en (px, pyF).
   Todo se controla por opciones: inclinacion, brazos, piernas, objeto.
   ========================================================================= */
const SKIN=['#f4cda4','#e3ad7c','#cd9059','#a86d3e','#7d4d2a','#5e3820'];
const HAIRC=['#141014','#3a2418','#5c3a1e','#8a6a3a','#c9a05a','#7a2f2f','#26263a','#dcd8d0','#a8324a'];
const SHIRT=['#eae6de','#2b2f4a','#8a2b3a','#2b5a4a','#c98a2b','#5a3a6a','#1f2430','#b8483a',
             '#3a6a8a','#d8c0a8','#4a4a52','#a83a6a','#347a5c','#e0663a'];
const PANTS=['#20222c','#2f2a3a','#3a3040','#181a22','#4a4038','#252d3a','#6a6270'];
function makePal(seed){
  const r=n=>{const x=Math.sin(seed*12.9898+n*78.233)*43758.5453; return x-Math.floor(x);};
  return { sk:SKIN[(r(1)*SKIN.length)|0], ha:HAIRC[(r(2)*HAIRC.length)|0],
           sh:SHIRT[(r(3)*SHIRT.length)|0], pa:PANTS[(r(4)*PANTS.length)|0],
           lg:r(5)>.5, sp:.75+r(7)*.6 };
}
const DARK='#15151b';
/* o = {f, lean, head, armL, armR, legs, hold, flip, rise, sh(color forzado)} */
function person(px,pyF,s,pal,o){
  o=o||{};
  const f=(o.f|0), rise=o.rise||0;
  const legs=o.legs||'stand', sit=(legs==='sit'||legs==='ride');
  const drop=sit?4:0, fl=!!o.flip;
  // lean/head se declaran en pantalla (+1 = hacia la derecha). Al espejar hay que
  // invertirlos, si no la figura invertida se inclina para el lado contrario.
  const lean=(fl?-1:1)*(o.lean||0), hd=(fl?-1:1)*(o.head||0);
  const sh=o.sh||pal.sh;
  const B=(x,y,w,h,c)=>{
    const xx = fl ? (8-x-w) : x;
    R(px+xx*s, pyF-(17-y+rise)*s, Math.max(1,w*s), Math.max(1,h*s), c);
  };
  const hand={};                                   // posicion de la mano, para los objetos
  // ---- piernas ----
  if(legs==='sit'){
    B(2,13,4,2,pal.pa); B(5,13,2,4,pal.pa); B(5,16,3,1,DARK);
  }else if(legs==='ride'){                          // sentado sobre hombros
    B(1,13,2,3,pal.pa); B(5,13,2,3,pal.pa);
  }else if(legs==='jump'){
    B(1,12,2,4,pal.pa); B(5,12,2,4,pal.pa);
  }else if(legs==='stride'){
    B(0,12,2,5,pal.pa); B(5,12,3,5,pal.pa); B(0,16,2,1,DARK); B(5,16,3,1,DARK);
  }else if(legs==='wide'){
    B(1,12,2,5,pal.pa); B(5,12,2,5,pal.pa); B(1,16,2,1,DARK); B(5,16,2,1,DARK);
  }else if(legs==='walk'){
    const sp=(f%2)?1:0;
    B(2-sp,12,2,5,pal.pa); B(4+sp,12,2,5,pal.pa);
    B(2-sp,16,2,1,DARK); B(4+sp,16,2,1,DARK);
  }else{
    B(2,12,2,5,pal.pa); B(4,12,2,5,pal.pa); B(2,16,2,1,DARK); B(4,16,2,1,DARK);
  }
  // ---- torso ----
  B(2+lean,6+drop,4,6-drop+ (sit?2:0),sh);
  // ---- brazos ----
  const arm=(side,mode)=>{
    const base=side<0?1:6;                          // columna del brazo
    const L=lean;
    if(mode==='up'){ B(base+ (side<0?L:L),2+drop,1,5,pal.sk); hand[side]= [base+L,2+drop]; }
    else if(mode==='out'){ B(side<0?0:6,7+drop,2,1,pal.sk); hand[side]=[side<0?0:7,7+drop]; }
    else if(mode==='fwd'){ B(side<0?0:6,8+drop,2,1,pal.sk); B(side<0?0:7,6+drop,1,2,pal.sk); hand[side]=[side<0?0:7,8+drop]; }
    else if(mode==='hip'){ B(base,7+drop,1,3,pal.sk); B(side<0?2:5,9+drop,1,1,pal.sk); hand[side]=[base,9+drop]; }
    else if(mode==='clap'){ B(3,7+drop,2,1,pal.sk); hand[side]=[3,7+drop]; }
    else if(mode==='cross'){ B(2,8+drop,4,1,pal.sk); hand[side]=[2,8+drop]; }
    else if(mode==='mid'){ B(base,7+drop,1,3,pal.sk); hand[side]=[base,9+drop]; }
    else { const sw=(legs==='walk')?((f%2)?(side<0?1:0):(side<0?0:1)):0;
           B(base,7+drop+sw,1,5-drop+(sit?2:0),pal.sk); hand[side]=[base,11+drop]; }
  };
  arm(-1,o.armL||'down'); arm(1,o.armR||'down');
  // ---- cabeza ----
  const hx=2+lean+hd;
  B(hx,1+drop,4,5,pal.sk);
  B(hx,0+drop,4,2,pal.ha);
  if(pal.lg){ B(hx-1,1+drop,1,4,pal.ha); B(hx+4,1+drop,1,4,pal.ha); }
  if(s>=2){ const ey=3+drop, eo=hd;
    if(eo>=0) B(hx+3,ey,1,1,'#241a1e');
    if(eo<=0) B(hx+1,ey,1,1,'#241a1e'); }
  // ---- objeto en mano ----
  if(o.hold){ const h=hand[1]||hand[-1]||[6,9]; prop(o.hold,B,h[0],h[1],pal); }
}
function prop(kind,B,hx,hy,pal){
  if(kind==='mic'){ B(hx,hy-2,1,3,'#2a2a34'); B(hx,hy-3,1,1,'#8d8aa0'); }
  else if(kind==='cup'){ B(hx,hy-2,2,2,'#c9d4dd'); B(hx,hy-3,2,1,'#f0f6fa'); }
  else if(kind==='phone'){ B(hx,hy-2,1,2,'#1d1d26'); }
  else if(kind==='guitar'){ B(hx-3,hy-1,4,3,'#8a3a24'); B(hx+1,hy-3,4,1,'#3a2a1e'); B(hx-2,hy,2,1,'#f0d8a0'); }
  else if(kind==='cam'){ B(hx-1,hy-2,3,2,'#1d1d26'); B(hx,hy-3,1,1,'#4a4a58'); }
  else if(kind==='fan'){ B(hx,hy-3,1,4,'#c9a05a'); }
  else if(kind==='mate'){ B(hx,hy-2,2,2,'#8a5a2a'); B(hx+1,hy-4,1,2,'#c9c2b4'); }
  else if(kind==='drum'){ B(hx-4,hy-2,5,4,'#c89a4a'); B(hx-4,hy-2,5,1,'#e8dcc8'); B(hx-4,hy+1,5,1,'#8a6a2e'); }
}

   ========================================================================= */
const WORLD=720;
const ZOOMS=[1,1.8,3];
const cam={x:0,y:0,vx:0};
let zi=0;
function zoom(){return ZOOMS[zi];}
function wdelta(wx,par){
  let d=wx-cam.x*(par===undefined?1:par);
  d=((d%WORLD)+WORLD)%WORLD; if(d>WORLD/2) d-=WORLD; return d;
}
const ZY=112;                       // ancla vertical del zoom = centro optico del cuadro
function sxOf(wx,par){ return W/2 + wdelta(wx,par); }          // dentro del transform
function scrX(wx,par){ return W/2 + wdelta(wx,par)*zoom(); }   // pantalla real
function scrY(wy){ return ZY + (wy + cam.y - ZY)*zoom(); }
function vis(x,m){ m=m||60; const s=W/2+(x-W/2)*zoom(); return s>-m && s<W+m; }
function rep(step,par,fn){
  const n=Math.ceil(WORLD/step);
  for(let i=0;i<n;i++){ const x=sxOf(i*step,par); if(vis(x,110)) fn(x,i); }
}
function bands(cols,y0,y1){
  const n=cols.length,h=(y1-y0)/n;
  for(let i=0;i<n;i++) R(0,y0+i*h,W,Math.ceil(h)+1,cols[i]);
}

const A={c:null,on:true,master:null,next:0,step:0};
function ainit(){ if(A.c)return;
  try{ A.c=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.c.createGain(); A.master.gain.value=.2; A.master.connect(A.c.destination);
  }catch(e){A.on=false;} }
function tone(f,dur,type,vol,slide){
  if(!A.c||!A.on)return;
  const t=A.c.currentTime,o=A.c.createOscillator(),g=A.c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.16,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol,hp){
  if(!A.c||!A.on)return;
  const n=A.c.sampleRate*dur|0,b=A.c.createBuffer(1,n,A.c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=A.c.createBufferSource(); s.buffer=b;
  const g=A.c.createGain(); g.gain.value=vol||.14;
  const fl=A.c.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=hp||1400;
  s.connect(fl); fl.connect(g); g.connect(A.master); s.start();
}

  win:()=>{[523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>tone(f,.13,'square',.15),i*75));},
  fail:()=>{[523,392,294,196].forEach((f,i)=>setTimeout(()=>tone(f,.26,'square',.14),i*150));},
  ui:()=>tone(600,.04,'square',.09),
  zoom:()=>tone(760,.05,'sine',.08,1.35)
};
const SCL=[0,3,5,7,10];
function music(){
  if(!A.c||!A.on||G.state!=='play'||G.paused) return;
  if(A.c.currentTime<A.next) return;
  const L=LV(), st=A.step%8, tempo=.16;
  if(st%2===0) tone(L.root/4,tempo*.9,'triangle',.10);
  if(st===0||st===3||st===6) tone(L.root*Math.pow(2,SCL[(A.step*2)%SCL.length]/12),tempo*.75,'square',.04);
  A.step++; A.next=A.c.currentTime+tempo;
}

/* =========================================================================
   ESTADO
   ========================================================================= */
const G={
  state:'title', t:0, paused:false,
  lvl:0, score:0, total:0, stars:[], done:[],
  battery:100, subs:[], crowd:[], parts:[], pops:[],
  focus:0, rec:false, recT:0, take:null, flash:0,
  brief:[], hint:'', hintT:0, shots:0, hits:0, peakHits:0,
  fr:{x:26,y:44,w:128,h:150}
};
function LV(){ return LEVELS[Math.max(0,Math.min(LEVELS.length-1,G.lvl|0))]; }
let SEED=1;

function shotOf(sub){
  // referencia = altura de UNA persona, no del grupo. Mantiene 1 paso de zoom = 1 plano.
  const ratio=17*sub.s*zoom()/G.fr.h;
  return ratio<.5?'GENERAL':ratio<.9?'MEDIO':'CLOSE';
}
function makeSub(tag,wx){
  const a=ACT[tag], dep=Math.random();
  const s=a.wu>=26 ? 3 : 3+Math.round(dep*.9);   // grupos anchos siempre en el plano lejano
  const pals=[]; for(let i=0;i<a.n;i++) pals.push(makePal(SEED++));
  return { tag, a, s, dep, pals, x:((wx%WORLD)+WORLD)%WORLD,
           y:HZ+12+dep*26, peak:0, cool:1+Math.random()*3, got:{}, flashT:0 };
}
function subBoxW(sb){                       // mundo: se dibuja dentro del transform
  const u=sb.s, w=sb.a.wu*u, h=(sb.a.hu||17)*u, cx=sxOf(sb.x,1);
  return {x:cx-w/2, y:sb.y-h, w, h, cx, cy:sb.y-h/2};
}
function subBox(sb){                        // pantalla: encuadre, brackets, hit test
  const b=subBoxW(sb), z=zoom();
  return {x:W/2+(b.x-W/2)*z, y:scrY(b.y), w:b.w*z, h:b.h*z,
          cx:W/2+(b.cx-W/2)*z, cy:scrY(b.cy)};
}
function buildLevel(){
  const L=LV();
  G.subs=[]; G.crowd=[]; G.parts=[]; G.pops=[];
  G.score=0; G.battery=100; G.focus=0; G.rec=false; G.take=null; G.recT=0;
  G.shots=0; G.hits=0; G.peakHits=0; zi=0; cam.x=0; cam.y=0; cam.vx=0;
  G.landIdx=(Math.random()*(L.lands?L.lands.length:1))|0;
  G.brief=L.brief.map(b=>({k:b.k,tag:b.tag,shot:b.shot,ok:false}));
  // reparto: cada accion aparece 2 veces, repartida en el mundo
  const slots=[]; for(let i=0;i<8;i++) slots.push(i*(WORLD/8)+Math.random()*40);
  shuffle(slots);
  let k=0;
  for(const tag of L.acts){ G.subs.push(makeSub(tag,slots[k++])); G.subs.push(makeSub(tag,slots[k++])); }
  for(let i=0;i<26;i++) G.crowd.push({x:Math.random()*WORLD, y:HZ+2+Math.random()*12,
    s:(Math.random()<.5?1:2), pal:makePal(SEED++), o:Math.random()*8,
    vx:(Math.random()*2-1)*3, legs:Math.random()<.4?'walk':'stand',
    armL:Math.random()<.25?'up':'down', armR:Math.random()<.25?'up':'down'});
  hint(L.id);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; const t=a[i];a[i]=a[j];a[j]=t;} }
function hint(s){G.hint=s;G.hintT=2.4;}
function pop(x,y,s,c,big){G.pops.push({x,y,s,c,t:0,big:!!big});}

/* =========================================================================
   CAPTURA
   ========================================================================= */
function framed(){
  const f=G.fr, out=[];
  for(const sb of G.subs){
    const b=subBox(sb);
    const ix=Math.max(0,Math.min(b.x+b.w,f.x+f.w)-Math.max(b.x,f.x));
    const iy=Math.max(0,Math.min(b.y+b.h,f.y+f.h)-Math.max(b.y,f.y));
    const cov=(ix*iy)/(b.w*b.h||1);
    if(cov>=.62) out.push({sb,b,cov});
  }
  return out;
}
function quality(){
  const steady=Math.max(0,1-Math.abs(cam.vx)*zoom()/90);
  return Math.min(1,G.focus*.7+steady*.3);
}
function briefMatch(sb,kind){
  const sh=shotOf(sb);
  for(const it of G.brief)
    if(!it.ok && it.k===kind && it.tag===sb.tag && it.shot===sh && !sb.got[it.tag+it.shot+kind]) return it;
  return null;
}
function shoot(){
  if(G.paused) return;
  G.shots++; SFX.shutter(); G.flash=Math.max(G.flash,.16);
  const fr=framed();
  if(!fr.length){ pop(W/2,G.fr.y+50,'SIN SUJETO',GREY); return; }
  const q=quality();
  let pts=0, best=null, done=null;
  for(const it of fr){
    const sb=it.sb;
    let base=90*sb.a.n*(.55+.45*it.cov)*(.45+.55*q);
    if(sb.peak>0){ base*=2.2; }
    const m=briefMatch(sb,'photo');
    if(m){ m.ok=true; done=m; sb.got[m.tag+m.shot+'photo']=1; base+=1400; }
    if(sb.peak>0) G.peakHits++;
    sb.flashT=.5;
    pts+=base;
    if(!best||sb.a.n>best.a.n) best=sb;
  }
  G.hits++;
  G.score+=Math.round(pts);
  G.battery=Math.min(100,G.battery+3);
  if(done){ pop(W/2,G.fr.y+42,'TOMA DEL BRIEF',CFG.ACCENT,true); SFX.tick(); checkDone(); }
  else { pop(W/2,G.fr.y+42,(best&&best.peak>0)?'PICO!':q>.75?'NITIDA':'OK',
         (best&&best.peak>0)?CFG.ACCENT:q>.75?GOOD:WHITE); SFX.good(); }
  pop(W/2,G.fr.y+54,'+'+Math.round(pts),CFG.ACCENT);
  if(navigator.vibrate) try{navigator.vibrate(done?24:8);}catch(e){}
}
function recToggle(){
  if(G.paused) return;
  if(G.rec){
    const tk=G.take; G.rec=false; G.take=null; SFX.stop();
    if(tk&&tk.pts>0){ G.score+=Math.round(tk.pts); pop(W/2,G.fr.y+54,'+'+Math.round(tk.pts),CFG.ACCENT); }
    else pop(W/2,G.fr.y+42,'TOMA VACIA',GREY);
  }else{ G.rec=true; G.recT=0; G.take={pts:0,hold:0,tgt:null}; SFX.rec(); }
}
function checkDone(){
  if(G.brief.every(b=>b.ok)) levelWin();
}
function levelWin(){
  const L=LV();
  const bonus=Math.round(G.battery*80);
  G.score+=bonus;
  const st=G.score>=L.goals[1]?3:G.score>=L.goals[0]?2:1;
  G.stars[G.lvl]=Math.max(G.stars[G.lvl],st);
  if(!G.done[G.lvl]){ G.done[G.lvl]=true; }
  G.total+=G.score;
  G.lastBonus=bonus; G.lastStars=st;
  G.state='result'; G.rec=false; SFX.win();
}
function levelFail(){ G.state='failed'; G.rec=false; SFX.fail(); }

/* =========================================================================
   UPDATE
   ========================================================================= */
function update(dt){
  G.t+=dt;
  G.flash=Math.max(0,G.flash-dt*1.8);
  G.hintT=Math.max(0,G.hintT-dt);
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.t+=dt;p.y-=dt*10;if(p.t>1.3)G.pops.splice(i,1);}
  const L=LV();
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt*.22;
    p.x+=Math.sin(G.t*2+p.y*.1)*9*dt;
    if(p.l<=0||p.y>VF+8) G.parts.splice(i,1);
  }
  if(G.parts.length<26 && Math.random()<.5)
    G.parts.push({x:Math.random()*W,y:-4,vx:(Math.random()*2-1)*6,vy:10+Math.random()*18,l:1,k:L.part,c:L.pc});

  if(drag.on) cam.vx*=Math.pow(.0005,dt);
  else { cam.x=((cam.x+cam.vx*dt)%WORLD+WORLD)%WORLD; cam.vx*=Math.pow(.02,dt);
         if(Math.abs(cam.vx)<1) cam.vx=0; }
  cam.y=Math.max(-20,Math.min(20,cam.y));
  for(const p of G.crowd) p.x=((p.x+p.vx*dt)%WORLD+WORLD)%WORLD;

  if(G.state!=='play'||G.paused) return;

  G.battery-=(100/L.secs+(G.rec?1.0:0))*dt;
  if(G.battery<=0){ G.battery=0; levelFail(); return; }

  for(const sb of G.subs){
    sb.flashT=Math.max(0,sb.flashT-dt);
    if(sb.peak>0) sb.peak-=dt;
    else { sb.cool-=dt; if(sb.cool<=0){ sb.peak=1.6; sb.cool=3.5+Math.random()*3.5;
      if(Math.abs(wdelta(sb.x))<150) SFX.peak(); } }
  }

  const fr=framed();
  const steady=Math.abs(cam.vx)*zoom()<50;
  if(fr.length&&steady){ const was=G.focus; G.focus=Math.min(1,G.focus+dt/.5);
    if(was<1&&G.focus>=1) SFX.focus(); }
  else G.focus=Math.max(0,G.focus-dt*1.7);

  if(G.rec&&!G.take) G.take={pts:0,hold:0,tgt:null};
  if(G.rec){
    G.recT+=dt;
    let m=null, sb=null;
    for(const it of fr){ const mm=briefMatch(it.sb,'video'); if(mm){m=mm;sb=it.sb;break;} }
    if(m){
      if(G.take.tgt!==sb){ G.take.tgt=sb; G.take.hold=0; }
      G.take.hold+=dt;
      if(G.take.hold>=2.4){ m.ok=true; sb.got[m.tag+m.shot+'video']=1;
        G.take.pts+=1600; G.take.hold=0; G.take.tgt=null;
        pop(W/2,G.fr.y+42,'TOMA DEL BRIEF',CFG.ACCENT,true); SFX.tick(); checkDone(); }
    }else{ G.take.hold=Math.max(0,G.take.hold-dt*.7); }
    if(fr.length){ let n=0,pk=false;
      for(const it of fr){ n+=it.sb.a.n; if(it.sb.peak>0) pk=true; }
      G.take.pts+=(34*n)*(.4+.6*quality())*(pk?1.8:1)*dt; }
  }
  music();
}

function drawSub(sb){
  const b=subBoxW(sb), u=sb.s;
  if(b.x>W+50||b.x+b.w<-50) return;
  const pk=sb.peak>0;
  for(let i=0;i<sb.a.n;i++){
    const o=sb.a.build(i,G.t,pk);
    const px=b.x+(o.dx||0)*u;
    if(sb.flashT>0) R(px,b.y-(o.rise||0)*u,8*u,17*u,'rgba(255,255,255,'+(sb.flashT).toFixed(2)+')');
    else person(px,b.y+b.h,u,sb.pals[i],o);
  }
  R(b.x,b.y+b.h,b.w,1,'rgba(0,0,0,.4)');
  if(sb.tag==='BESO'&&pk){
    const hp=['01010','11111','11111','01110','00100'];
    const hx=b.cx-2, hy=b.y-8+Math.round(Math.sin(G.t*5));
    ctx.fillStyle='#ff5d7a';
    for(let r=0;r<5;r++)for(let c=0;c<5;c++)
      if(hp[r][c]==='1') ctx.fillRect((hx+c)|0,(hy+r)|0,1,1);
  }
  if(pk) for(let i=0;i<3;i++){ const a=G.t*3+i*2.1;
    R(b.cx+Math.cos(a)*(b.w/2+4),b.cy+Math.sin(a)*(b.h/2),2,2,CFG.ACCENT); }
}
function drawWorld(){
  const L=LV();
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,VF); ctx.clip();
  ctx.save();
  ctx.translate(W/2,ZY); ctx.scale(zoom(),zoom()); ctx.translate(-W/2,-ZY);
  ctx.translate(0,cam.y);
  bands(L.sky,-18-60/zoom(),HZ);
  L.far(G.t);
  if(L.lands){ const fn=LANDS[L.lands[(G.landIdx||0)%L.lands.length]]; if(fn) fn(G.t); }
  R(0,HZ,W,VF+40-HZ,L.floor); R(0,HZ,W,1,L.line);
  for(let i=1;i<6;i++) R(0,HZ+i*i*2.6,W,1,'rgba(0,0,0,.20)');
  for(const p of G.crowd){ const x=sxOf(p.x,1); if(!vis(x,20)) continue;
    person(x-4*p.s,p.y,p.s,p.pal,{legs:p.legs,armL:p.armL,armR:p.armR,f:(G.t*4+p.o)|0}); }
  R(0,HZ+1,W,9,'rgba(0,0,0,.16)');
  L.mid(G.t);
  for(const sb of G.subs.slice().sort((a,b)=>a.dep-b.dep)) drawSub(sb);
  ctx.restore();
  // primer plano fuera de foco: en pantalla, no escala con el zoom optico
  const n=Math.ceil(WORLD/300);
  for(let i=0;i<n;i++){
    const x=scrX(i*300,1.5); if(x<-30||x>W+30) continue;
    const h=22+(i*9)%10;
    R(x-13,VF-h+6,26,h,'rgba(0,0,0,.40)'); disc(x,VF-h+6,11,'rgba(0,0,0,.40)');
    dith(x-15,VF-h-5,30,12,'rgba(0,0,0,.30)',2);
  }
  ctx.restore();
  for(const p of G.parts){ if(p.y>VF) continue;
    if(p.k==='beam') R(p.x,p.y,1,5,p.c); else R(p.x,p.y,2,2,p.c); }
}

  for(const [cx,cy,dx,dy] of [[f.x,f.y,1,1],[f.x+f.w,f.y,-1,1],[f.x,f.y+f.h,1,-1],[f.x+f.w,f.y+f.h,-1,-1]]){

function btn(x,y,w,h,label,fn,style){
  BTNS.push({x,y,w,h,fn});
  const bg = style==='p'?CFG.ACCENT : style==='g'?'#12492f' : style==='w'?'#1f4a2a' : '#1c1a26';
  R(x+1,y+1,w,h,'rgba(0,0,0,.45)'); R(x,y,w,h,bg); R(x,y,w,1,'rgba(255,255,255,.18)');
  txt(label,x+w/2,y+(h-5)/2,style==='p'?INK:WHITE,1,'c');
}
function hitBtns(){ for(const b of BTNS)
  if(UI.x>b.x&&UI.x<b.x+b.w&&UI.y>b.y&&UI.y<b.y+b.h){SFX.ui();b.fn();return true;} return false; }
function backdrop(a){ drawWorld(); R(0,0,W,H,'rgba(8,8,11,'+a+')'); }

/* =========================================================================
   LOOP
   ========================================================================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now;
  update(dt);
  BTNS=[];
  R(0,0,W,H,INK);
  if(G.state==='title') scTitle();
  else if(G.state==='levels') scLevels();
  else if(G.state==='howto') scHowto();
  else if(G.state==='briefing') scBriefing();
  else if(G.state==='play') scPlay();
  else if(G.state==='result') scResult();
  else if(G.state==='failed') scFailed();
  else if(G.state==='final') scFinal();
  if(G.flash>0) R(0,0,W,VF,'rgba(255,255,255,'+Math.min(.8,G.flash*3.4).toFixed(2)+')');
  requestAnimationFrame(frame);
}

/* =========================================================================
   INPUT
   ========================================================================= */
const UI={x:0,y:0};
const drag={on:false,id:null,x:0,y:0,t:0,moved:0,inVF:false};
function toGame(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
function onDown(e){
  e.preventDefault(); ainit();
  if(A.c&&A.c.state==='suspended') A.c.resume();
  const p=toGame(e); UI.x=p.x; UI.y=p.y;
  if(G.state==='play'&&!G.paused){
    if(p.x>W-16&&p.y<15){ G.paused=true; SFX.ui(); return; }
    if(inB(BTN.zoom,p.x,p.y)){ zi=(zi+1)%ZOOMS.length; SFX.zoom(); return; }
    if(inB(BTN.rec,p.x,p.y)){ recToggle(); return; }
    if(inB(BTN.shut,p.x,p.y)){ shoot(); return; }
  }
  drag.on=true; drag.id=e.pointerId; drag.x=p.x; drag.y=p.y;
  drag.t=performance.now(); drag.moved=0; drag.inVF=(p.y<VF);
  if(drag.inVF&&G.state==='play') cam.vx=0;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
}
function onMove(e){
  e.preventDefault();
  const p=toGame(e); UI.x=p.x; UI.y=p.y;
  if(!drag.on||e.pointerId!==drag.id) return;
  const dx=p.x-drag.x, dy=p.y-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(G.state==='play'&&!G.paused&&drag.inVF){
    cam.x=((cam.x-dx/zoom())%WORLD+WORLD)%WORLD;
    cam.y=Math.max(-14,Math.min(14,cam.y-dy*.3));
    cam.vx=-dx/zoom()*22;
  }
  drag.x=p.x; drag.y=p.y;
}
function onUp(e){
  e.preventDefault();
  if(!drag.on) return;
  const held=performance.now()-drag.t, moved=drag.moved;
  drag.on=false;
  if(G.state==='play'&&!G.paused){ if(drag.inVF&&held<230&&moved<7) shoot(); }
  else hitBtns();
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',()=>{drag.on=false;},{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(G.state!=='play') return;
  if(e.code==='Escape'){ G.paused=!G.paused; return; }
  if(G.paused) return;
  if(e.code==='Space'){e.preventDefault();shoot();}
  if(e.code==='KeyR') recToggle();
  if(e.code==='KeyZ') zi=(zi+1)%ZOOMS.length;
  if(e.code==='ArrowLeft') cam.x=((cam.x-16)%WORLD+WORLD)%WORLD;
  if(e.code==='ArrowRight') cam.x=((cam.x+16)%WORLD+WORLD)%WORLD;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){drag.on=false;
  if(G.state==='play') G.paused=true;}});
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,120));
if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);

G.stars=LEVELS.map(()=>0); G.done=LEVELS.map(()=>0);
fit(); buildLevel(); G.state='title';
requestAnimationFrame(frame);
</script>
